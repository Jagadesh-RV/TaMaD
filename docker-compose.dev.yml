services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: tamad_backend_dev
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5001:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/tamad
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-${JWT_SECRET}}
      - FRONTEND_URL=http://localhost:5173
      - CORS_ORIGIN=http://localhost:5173,http://localhost:3000
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./backend/src:/app/src
    depends_on:
      # Dev-only MongoDB — no auth, port exposed for local tools.
      # Production uses MONGO_INITDB_ROOT_PASSWORD via docker-compose.yml / deployment configs.
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tamad_dev_network

  mongo:
    image: mongo:7
    container_name: tamad_mongo_dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - tamad_mongo_dev_data:/data/db
    networks:
      - tamad_dev_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tamad_redis_dev
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - tamad_redis_dev_data:/data
    networks:
      - tamad_dev_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: tamad_frontend_dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend
    networks:
      - tamad_dev_network

  mongo-express:
    image: mongo-express:latest
    container_name: tamad_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_EXPRESS_USERNAME:-admin}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXPRESS_PASSWORD:-admin}
    depends_on:
      - mongo
    networks:
      - tamad_dev_network

volumes:
  tamad_mongo_dev_data:
  tamad_redis_dev_data:

networks:
  tamad_dev_network:
    driver: bridge
