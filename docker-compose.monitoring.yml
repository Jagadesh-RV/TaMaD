version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: tamad_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deployment/prometheus.yml:/etc/prometheus/prometheus.yml
      - tamad_prometheus_data:/prometheus
    networks:
      - tamad_monitoring_network

  grafana:
    image: grafana/grafana:latest
    container_name: tamad_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - tamad_grafana_data:/var/lib/grafana
      - ./deployment/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./deployment/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - tamad_monitoring_network

volumes:
  tamad_prometheus_data:
  tamad_grafana_data:

networks:
  tamad_monitoring_network:
    driver: bridge
