version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tamad_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - tamad_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tamad_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - tamad_network

networks:
  tamad_network:
    driver: bridge
