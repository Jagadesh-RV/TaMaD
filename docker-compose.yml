version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tamad_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - REDIS_URL=redis://redis:6379
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - mongo
      - redis
    networks:
      - tamad_network

  mongo:
    image: mongo:7
    container_name: tamad_mongo
    restart: always
    volumes:
      - tamad_mongo_data:/data/db
    networks:
      - tamad_network

  redis:
    image: redis:7-alpine
    container_name: tamad_redis
    restart: always
    networks:
      - tamad_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tamad_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - tamad_network

volumes:
  tamad_mongo_data:

networks:
  tamad_network:
    driver: bridge
