version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: tamad_user
      POSTGRES_PASSWORD: tamad_password
      POSTGRES_DB: tamad_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tamad_user -d tamad_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
